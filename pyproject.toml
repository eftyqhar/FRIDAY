[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-agent"
version = "0.1.0"
description = "F.R.I.D.A.Y. - Autonomous Browser Copilot powered by Playwright & LLMs"
readme = "README.md"
authors = [{ name = "Eftyqhar" }]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49.0",
    "google-genai>=0.8.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pillow>=10.0.0"
]

[project.scripts]
friday = "main:main"
